<header class="page-header">
  <div class="page-header__text">
    @if (eyebrow()) {
      <p class="section-title">{{ eyebrow() }}</p>
    }
    <h1>{{ title() }}</h1>
    @if (subtitle()) {
      <p class="muted">{{ subtitle() }}</p>
    }
  </div>

  <!-- Any buttons the page needs are projected in here. -->
  <div class="page-header__actions">
    <ng-content />
  </div>
</header>
